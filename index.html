<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Торговые сигналы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <h1>📊 Торговые сигналы</h1>
            <p class="subtitle">Фьючерсы Московской биржи</p>
        </header>

        <!-- Панель управления -->
        <section class="controls">
            <div class="control-group">
                <label>Таймфрейм</label>
                <select id="timeframe">
                    <option value="60">1 час</option>
                    <option value="24" selected>1 день</option>
                    <option value="7">1 неделя</option>
                    <option value="31">1 месяц</option>
                </select>
            </div>

            <div class="control-group instruments">
                <label>Инструменты</label>
                <div class="instrument-checkboxes">
                    <label><input type="checkbox" value="RTS" checked> РТС</label>
                    <label><input type="checkbox" value="Si" checked> Доллар/рубль</label>
                    <label><input type="checkbox" value="BR" checked> Нефть Brent</label>
                    <label><input type="checkbox" value="GOLD" checked> Золото</label>
                </div>
            </div>

            <button id="refreshBtn">Обновить</button>
        </section>

        <!-- 🔥 Блок выбора паттернов -->
        <section class="patterns-section">
            <details open>
                <summary>🧩 Паттерны <span class="patterns-count">(выбрано: все)</span></summary>
                <div class="patterns-grid" id="patternsContainer">
                    <!-- Заполняется из JavaScript -->
                </div>
                <div class="patterns-actions">
                    <button id="selectAllPatterns">Выбрать все</button>
                    <button id="deselectAllPatterns">Снять все</button>
                </div>
            </details>
        </section>

        <!-- Результаты -->
        <div id="results" class="results">
            <div class="loading">Загрузка...</div>
        </div>

        <!-- Футер -->
        <footer class="footer">
            <p>Данные с MOEX • Сигналы не являются рекомендацией</p>
        </footer>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
