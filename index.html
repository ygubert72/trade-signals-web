<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Торговый сканер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header>
            <div>
                <h1>📊 Торговый сканер</h1>
                <p class="sub">Фьючерсы и акции Московской биржи</p>
            </div>
            <button id="exportBtn" class="btn-export" disabled>📥 Экспорт в Excel</button>
        </header>

        <!-- Управление -->
        <div class="control-panel">
            <div class="control-group">
                <label>Таймфрейм</label>
                <select id="timeframe">
                    <option value="60">1 час</option>
                    <option value="24" selected>1 день</option>
                    <option value="7">1 неделя</option>
                    <option value="31">1 месяц</option>
                </select>
            </div>

            <div class="control-group">
                <label>Индикаторы</label>
                <div class="checkboxes" id="indicatorsContainer">
                    <label><input type="checkbox" value="ema"> EMA (50/100)</label>
                    <label><input type="checkbox" value="rsi"> RSI (14)</label>
                    <label><input type="checkbox" value="adx"> ADX (14)</label>
                </div>
            </div>

            <button id="scanBtn" class="btn-scan">🚀 Запустить анализ</button>
        </div>

        <!-- Паттерны -->
        <div class="section">
            <details open>
                <summary>🧩 Паттерны <span class="count" id="patternsCount">(выбрано: 0)</span></summary>
                <div class="grid patterns-grid" id="patternsContainer"></div>
                <div class="actions">
                    <button id="selectAllPatterns">Выбрать все</button>
                    <button id="deselectAllPatterns">Снять все</button>
                </div>
            </details>
        </div>

        <!-- Фьючерсы -->
        <div class="section">
            <details open>
                <summary>
                    <span>📈 Фьючерсы</span>
                    <label class="all-label"><input type="checkbox" id="selectAllFutures"> Все</label>
                </summary>
                <div class="grid instruments-grid" id="futuresContainer"></div>
            </details>
        </div>

        <!-- Акции -->
        <div class="section">
            <details open>
                <summary>
                    <span>🏢 Акции</span>
                    <label class="all-label"><input type="checkbox" id="selectAllStocks"> Все</label>
                </summary>
                <div class="grid instruments-grid" id="stocksContainer"></div>
            </details>
        </div>

        <!-- Лог -->
        <div class="section">
            <details open>
                <summary>📋 Лог сканирования</summary>
                <div class="log" id="logContainer">
                    <div class="log-empty">Ожидание запуска анализа...</div>
                </div>
            </details>
        </div>

        <!-- Результаты -->
        <div id="results" class="results">
            <div class="empty">📭 Запустите анализ для получения сигналов</div>
        </div>

        <footer>Данные с MOEX • Сигналы не являются рекомендацией</footer>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
