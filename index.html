<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Торговый сканер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <div>
                <h1>📊 Торговый сканер</h1>
                <p class="subtitle">Фьючерсы и акции Московской биржи</p>
            </div>
            <button id="exportBtn" class="btn-export" disabled>📥 Экспорт в Excel</button>
        </header>

        <!-- Панель управления -->
        <section class="controls">
            <div class="control-group">
                <label>Таймфрейм</label>
                <select id="timeframe">
                    <option value="60">1 час</option>
                    <option value="24" selected>1 день</option>
                    <option value="7">1 неделя</option>
                    <option value="31">1 месяц</option>
                </select>
            </div>

            <div class="control-group">
                <label>Индикаторы</label>
                <div class="checkbox-group" id="indicatorsContainer">
                    <label><input type="checkbox" value="ema"> EMA (50/100)</label>
                    <label><input type="checkbox" value="rsi"> RSI (14)</label>
                    <label><input type="checkbox" value="adx"> ADX (14)</label>
                </div>
            </div>

            <button id="scanBtn" class="btn-scan">🚀 Запустить анализ</button>
        </section>

        <!-- Инструменты: Фьючерсы -->
        <section class="instruments-section">
            <details open>
                <summary>
                    <span>📈 Фьючерсы</span>
                    <label class="select-all-label">
                        <input type="checkbox" id="selectAllFutures"> Все
                    </label>
                </summary>
                <div class="instruments-grid" id="futuresContainer">
                    <!-- Заполняется из JavaScript -->
                </div>
            </details>
        </section>

        <!-- Инструменты: Акции -->
        <section class="instruments-section">
            <details open>
                <summary>
                    <span>🏢 Акции</span>
                    <label class="select-all-label">
                        <input type="checkbox" id="selectAllStocks"> Все
                    </label>
                </summary>
                <div class="instruments-grid" id="stocksContainer">
                    <!-- Заполняется из JavaScript -->
                </div>
            </details>
        </section>

        <!-- Паттерны -->
        <section class="patterns-section">
            <details open>
                <summary>🧩 Паттерны <span class="patterns-count">(выбрано: 0)</span></summary>
                <div class="patterns-grid" id="patternsContainer">
                    <!-- Заполняется из JavaScript -->
                </div>
                <div class="patterns-actions">
                    <button id="selectAllPatterns">Выбрать все</button>
                    <button id="deselectAllPatterns">Снять все</button>
                </div>
            </details>
        </section>

        <!-- Лог сканирования -->
        <section class="log-section">
            <details open>
                <summary>📋 Лог сканирования</summary>
                <div class="log-container" id="logContainer">
                    <div class="log-empty">Ожидание запуска анализа...</div>
                </div>
            </details>
        </section>

        <!-- Результаты -->
        <div id="results" class="results">
            <div class="loading">📭 Запустите анализ для получения сигналов</div>
        </div>

        <!-- Футер -->
        <footer class="footer">
            <p>Данные с MOEX • Сигналы не являются рекомендацией</p>
        </footer>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
