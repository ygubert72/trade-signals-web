<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Торговые сигналы по фьючерсам</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Торговые сигналы по фьючерсам</h1>
            <p class="subtitle">Анализ на основе EMA, ADX, RSI + паттерны</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="timeframe">Таймфрейм:</label>
                <select id="timeframe">
                    <option value="Час">1 час</option>
                    <option value="День" selected>1 день</option>
                    <option value="Неделя">1 неделя</option>
                    <option value="Месяц">1 месяц</option>
                </select>
            </div>

            <div class="control-group">
                <label for="patterns">Паттерны:</label>
                <select id="patterns" multiple size="3">
                    <!-- Заполняется через JavaScript -->
                </select>
                <small>Удерживайте Ctrl для выбора нескольких</small>
            </div>

            <button id="refreshBtn" onclick="loadSignals()">🔄 Обновить сигналы</button>
        </div>

        <div id="signals-container">
            <div class="loading">Загрузка сигналов...</div>
        </div>

        <footer>
            <p>Данные обновляются каждые 5 минут • Сигналы не являются рекомендацией к действию</p>
        </footer>
    </div>

    <script>
        let currentData = [];

        async function loadSignals() {
            const timeframe = document.getElementById('timeframe').value;
            const patternsSelect = document.getElementById('patterns');
            const selectedPatterns = Array.from(patternsSelect.selectedOptions).map(opt => opt.value);
            
            const container = document.getElementById('signals-container');
            container.innerHTML = '<div class="loading">⏳ Загрузка сигналов...</div>';

            try {
                const params = new URLSearchParams({
                    timeframe: timeframe
                });
                
                if (selectedPatterns.length > 0) {
                    params.append('patterns', selectedPatterns.join(','));
                }

                const response = await fetch(`/api/signals?${params.toString()}`);
                const data = await response.json();

                if (response.ok) {
                    currentData = data;
                    renderSignals(data);
                } else {
                    container.innerHTML = `<div class="error">❌ Ошибка: ${data.error || 'Неизвестная ошибка'}</div>`;
                }
            } catch (error) {
                container.innerHTML = `<div class="error">❌ Ошибка загрузки: ${error.message}</div>`;
            }
        }

        function renderSignals(data) {
            const container = document.getElementById('signals-container');
            
            if (!data || data.length === 0) {
                container.innerHTML = '<div class="no-signals">📭 Сигналов нет</div>';
                return;
            }

            let html = '<div class="signals-grid">';
            
            data.forEach(item => {
                const signalClass = item.signal.toLowerCase();
                const signalEmoji = item.signal === 'BUY' ? '🟢' : 
                                   item.signal === 'SELL' ? '🔴' : '🟡';
                
                html += `
                    <div class="signal-card ${signalClass}">
                        <div class="signal-header">
                            <h2>${item.display_name}</h2>
                            <span class="symbol">${item.symbol}</span>
                            <span class="timeframe-badge">${item.timeframe}</span>
                        </div>
                        
                        <div class="signal-price">
                            Цена: <strong>${item.current_price.toFixed(2)}</strong>
                        </div>
                        
                        <div class="signal-main">
                            <div class="signal-status ${signalClass}">
                                ${signalEmoji} ${item.signal}
                            </div>
                            <div class="signal-desc">${item.signal_description}</div>
                        </div>
                        
                        <details class="indicators-details">
                            <summary>📈 Индикаторы</summary>
                            <div class="indicators-grid">
                                <div class="indicator-item">
                                    <span class="indicator-label">EMA50</span>
                                    <span class="indicator-value">${item.indicators.ema50?.toFixed(2) || 'Н/Д'}</span>
                                </div>
                                <div class="indicator-item">
                                    <span class="indicator-label">EMA100</span>
                                    <span class="indicator-value">${item.indicators.ema100?.toFixed(2) || 'Н/Д'}</span>
                                </div>
                                <div class="indicator-item">
                                    <span class="indicator-label">RSI</span>
                                    <span class="indicator-value ${item.indicators.rsi > 70 ? 'overbought' : item.indicators.rsi < 30 ? 'oversold' : ''}">
                                        ${item.indicators.rsi?.toFixed(1) || 'Н/Д'}
                                    </span>
                                </div>
                                <div class="indicator-item">
                                    <span class="indicator-label">ADX</span>
                                    <span class="indicator-value ${item.indicators.adx > 25 ? 'trend' : 'no-trend'}">
                                        ${item.indicators.adx?.toFixed(1) || 'Н/Д'}
                                    </span>
                                </div>
                            </div>
                        </details>
                        
                        ${item.patterns && item.patterns.length > 0 ? `
                            <details class="patterns-details">
                                <summary>🔍 Паттерны (${item.patterns.length})</summary>
                                <ul class="patterns-list">
                                    ${item.patterns.map(p => `
                                        <li class="pattern-item">
                                            <span class="pattern-signal ${p.signal.toLowerCase()}">${p.signal}</span>
                                            <span class="pattern-name">${p.pattern}</span>
                                            <span class="pattern-confidence ${p.confidence}">${p.confidence}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </details>
                        ` : ''}
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        async function loadPatterns() {
            try {
                const response = await fetch('/api/patterns');
                const patterns = await response.json();
                
                const select = document.getElementById('patterns');
                select.innerHTML = patterns.map(p => 
                    `<option value="${p}">${p}</option>`
                ).join('');
                
                // Выбираем все по умолчанию
                Array.from(select.options).forEach(opt => opt.selected = true);
            } catch (error) {
                console.error('Ошибка загрузки паттернов:', error);
            }
        }

        // Загрузка при открытии страницы
        window.onload = function() {
            loadPatterns();
            loadSignals();
            
            // Автообновление каждые 5 минут
            setInterval(loadSignals, 5 * 60 * 1000);
        };
    </script>
</body>
</html>
